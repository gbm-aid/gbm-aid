name: Tests

# NOT (2026-08-12, backend-agent/Sultan): Bu repo koku `gbm-aid mert/`
# klasorudur (`git rev-parse --show-toplevel` ile dogrulandi, origin ->
# https://github.com/gbm-aid/gbm-aid.git). Bu dosya BURAYA (repo icine)
# konuldu, ust dizindeki "GBM-AID Prototip/" klasoru git deposu DEGIL --
# oraya konsaydi hicbir zaman tetiklenmezdi. Detay:
# decisions/2026-08-12-github-actions-ci-kurulumu.md

"on":
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu getir
        uses: actions/checkout@v4

      - name: Python 3.10 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Testleri calistir
        # DB/redis gerektiren canli baglanti testi YOK (grep ile
        # dogrulandi, tum testler monkeypatch/Fake nesneleriyle calisiyor)
        # -- bu yuzden hicbir secret/credential burada gerekmiyor. Ileride
        # gercek DB baglantisi gerektiren bir test eklenirse, kimlik
        # bilgisi BU DOSYAYA gomulmemeli; GitHub repo Secrets (Settings ->
        # Secrets and variables -> Actions) uzerinden env degiskeni olarak
        # gecilmeli, ya da o testler CI'da ortam degiskeni kontroluyle
        # acikca skip edilmeli (sessiz atlama degil, pytest.mark.skipif
        # ile GEREKCELI atlama).
        run: |
          pytest tests/ -v
